<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人设置 · TOPHOO Global</title>
    <link rel="icon" type="image/x-icon" href="/static/images/tophoo-global.ico">
    <link rel="stylesheet" href="/static/css/account.css?v=20261021-chinese">
</head>
<body class="account-page">
    <main class="account-layout">
        <header class="account-top"><a class="account-brand" href="/"><span class="account-brand-mark">T</span><span>TOPHOO Global</span></a><a class="account-back" href="/" data-back-navigation>返回上个页面</a></header>
        <section class="account-heading">
            <p class="account-eyebrow">ACCOUNT SETTINGS</p>
            <h1>个人设置</h1>
            <p>管理登录资料和工作台访问权限。</p>
        </section>
        <div class="account-grid">
            <section class="account-card account-profile-card">
                <div class="account-card-heading"><div><h2>个人资料</h2><p>修改昵称、手机号、微信号或登录密码。</p></div><span class="account-status">已启用</span></div>
                <form id="profile-form" class="account-form">
                <div class="account-fields">
                <label>登录邮箱<input id="profile-email" type="email" value="{{ user.email }}" disabled></label>
                <label>昵称<input id="profile-name" type="text" value="{{ user.display_name }}" maxlength="100" required></label>
                <label>手机号<input id="profile-phone" type="tel" value="{{ user.phone or '' }}" inputmode="numeric" pattern="1[0-9]{10}" placeholder="请输入 11 位手机号码"></label>
                <label>微信号<input id="profile-wechat" type="text" value="{{ user.wechat_id or '' }}" maxlength="100" placeholder="请输入微信号"></label>
                </div>
                <section class="account-security" aria-labelledby="security-title"><div class="account-section-heading"><h3 id="security-title">密码与安全</h3><p>如需修改密码，请填写以下两项</p></div><div class="account-fields">
                <label>当前密码<input id="profile-current-password" type="password" autocomplete="current-password"></label>
                <label>新密码<input id="profile-new-password" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 位；不修改请留空"></label>
                </div></section>
                <div class="account-form-footer"><p id="profile-message" class="account-message" aria-live="polite"></p>
                <button type="submit">保存修改 <span aria-hidden="true">↗</span></button></div>
                </form>
            </section>
            <aside class="account-side">
                <section class="account-card account-access-card">
                    <div class="account-access-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 4 6v6c0 4 8 9 8 9s8-5 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg></div><span class="account-card-label">工作台权限</span>
                    <h2>{{ "管理员" if user.is_admin else "成员用户" }}</h2>
                    <p>{% if user.is_admin %}你可以创建测试用户、配置工作区授权并管理平台用户。{% else %}你可以访问被授予权限的工作区和项目。{% endif %}</p>
                    {% if user.is_admin %}<a class="account-secondary-link" href="/admin/users">进入用户管理 →</a>{% endif %}
                </section>
            </aside>
        </div>
    </main>
    <script src="/static/js/profile.js?v=20261112-session"></script>
    <script src="/static/js/back-navigation.js"></script>
</body>
</html>
