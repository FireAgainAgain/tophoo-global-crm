<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 · TOPHOO Global</title>
    <link rel="icon" type="image/x-icon" href="/static/images/tophoo-global.ico">
<link rel="stylesheet" href="/static/css/login.css?v=20261021-chinese"><link rel="stylesheet" href="/static/css/mobile.css"><link rel="stylesheet" href="/static/css/admin-users.css?v=20261030-password">
</head>
<body class="login-page admin-users-page">
<main class="admin-layout" data-current-admin-id="{{ user.id }}">
<header class="account-top"><a class="login-brand account-brand" href="/"><span class="login-brand-mark">T</span><span>TOPHOO Global</span></a><a class="account-back" href="/" data-back-navigation>返回上个页面</a></header>
<section class="admin-heading admin-users-heading"><div><p class="login-eyebrow">ADMIN CONSOLE</p><h1>用户管理</h1><p>管理用户资料、账号状态及其拥有的工作区授权。</p></div><button type="button" class="admin-primary" id="open-create-user" disabled>＋ 新增用户</button></section>
<p id="admin-user-message" class="admin-page-message" role="status"></p>
<section class="admin-card admin-users-card" aria-label="用户列表">
<div class="admin-user-filters"><label class="admin-user-search"><span class="sr-only">搜索用户</span><input type="search" id="user-search" placeholder="搜索昵称、邮箱、手机号或微信号" maxlength="200"></label><label><span class="sr-only">账号状态</span><select id="user-status"><option value="all">全部状态</option><option value="active">启用中</option><option value="inactive">已停用</option></select></label><span id="user-total" role="status">正在加载…</span></div>
<div class="admin-table-wrap"><table><thead><tr><th>用户</th><th>联系方式</th><th>工作区授权</th><th>已参与项目</th><th>状态</th><th>操作</th></tr></thead><tbody id="admin-user-rows"><tr><td colspan="6" class="admin-empty">正在加载用户…</td></tr></tbody></table></div>
</section>
</main>
<dialog id="user-editor-dialog" class="admin-user-dialog" aria-labelledby="user-editor-title">
<form id="user-editor-form">
<header class="admin-dialog-heading"><div><h2 id="user-editor-title">编辑用户</h2><p id="user-editor-intro">修改用户的基本资料。</p></div><button type="button" data-close-editor class="admin-icon" aria-label="关闭用户编辑">×</button></header>
<div class="admin-form admin-user-fields">
<label>昵称<input name="display_name" required maxlength="100" autocomplete="off"></label>
<label>登录邮箱<input name="email" type="email" required maxlength="255" autocomplete="off"></label>
<label>手机号（可选）<input name="phone" type="tel" pattern="1[0-9]{10}" maxlength="11" placeholder="11 位手机号"></label>
<label>微信号（可选）<input name="wechat_id" maxlength="100" autocomplete="off"></label>
<label data-create-only>初始密码<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
<label data-access-field>工作区授权<select name="plan_code"></select><small>调整此用户拥有的工作区，项目角色保持不变。</small></label>
<label data-edit-only>账号状态<select name="is_active"><option value="true">启用</option><option value="false">停用</option></select><small data-self-note hidden>当前管理员不能停用自己的账号。</small></label>
</div>
<p id="user-editor-message" class="admin-message" role="alert"></p>
<footer class="admin-dialog-footer"><button type="button" data-close-editor class="admin-secondary">取消</button><button type="submit" class="admin-primary">保存修改</button></footer>
</form>
</dialog>
<dialog id="user-password-dialog" class="admin-user-dialog admin-password-dialog" aria-labelledby="user-password-title">
<form id="user-password-form">
<header class="admin-dialog-heading"><div><h2 id="user-password-title">修改密码</h2><p id="user-password-account"></p></div><button type="button" data-close-password class="admin-icon" aria-label="关闭修改密码">×</button></header>
<div class="admin-form admin-user-fields" style="grid-template-columns:1fr">
<label>新密码<input name="new_password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="user-password-hint"><small id="user-password-hint">8–128 位，无需填写用户原密码。下次登录使用新密码。</small></label>
<label>确认新密码<input name="confirm_password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
</div>
<p id="user-password-message" class="admin-message" role="alert"></p>
<footer class="admin-dialog-footer"><button type="button" data-close-password class="admin-secondary">取消</button><button type="submit" class="admin-primary">保存新密码</button></footer>
</form>
</dialog>
<script src="/static/js/admin-users.js?v=20261030-password"></script><script src="/static/js/back-navigation.js"></script>
</body>
</html>
