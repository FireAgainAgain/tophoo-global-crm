<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟支付 · TOPHOO Global</title>
    <link rel="icon" type="image/x-icon" href="/static/images/tophoo-global.ico">
    <link rel="stylesheet" href="/static/css/login.css?v=20261021-chinese">
    <link rel="stylesheet" href="/static/css/test-checkout.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body class="login-page">
    <main class="checkout-layout" data-plan-code="{{ plan.code }}">
        <header class="account-top"><a class="login-brand account-brand" href="/"><span class="login-brand-mark">T</span><span>TOPHOO Global</span></a><a class="account-back" href="/api/billing/pricing" data-back-navigation>返回上个页面</a></header>
        <section class="checkout-shell">
            <div class="checkout-notice">测试环境 · 不会发起真实扣款</div>
            <p class="login-eyebrow">TEST CHECKOUT</p>
            <h1>确认开通专业版</h1>
            <p class="checkout-intro">请选择一个模拟支付方式。确认后会立即为当前测试账号开通专业版。</p>
            <div class="checkout-order"><span>TOPHOO Global · {{ plan.name }}</span><strong>$5 <small>/ 月</small></strong><em>支付宝模拟支付：¥35 / 月</em></div>
            <div class="checkout-methods" role="radiogroup" aria-label="选择模拟支付方式">
                <button type="button" class="checkout-method active" data-method="stripe" role="radio" aria-checked="true"><b>Stripe</b><span>模拟国际信用卡支付</span></button>
                <button type="button" class="checkout-method" data-method="alipay" role="radio" aria-checked="false"><b>支付宝</b><span>模拟人民币支付</span></button>
            </div>
            <button id="test-payment-submit" class="checkout-submit" type="button">确认模拟支付并开通</button>
            <p id="checkout-message" class="checkout-message" aria-live="polite"></p>
            <p class="checkout-footnote">这是测试功能：不会跳转第三方平台，不会记录真实订单，也不会扣款。</p>
        </section>
    </main>
    <script src="/static/js/test-checkout.js"></script>
    <script src="/static/js/back-navigation.js"></script>
</body>
</html>
