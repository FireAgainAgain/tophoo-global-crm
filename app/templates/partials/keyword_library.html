<section class="project-library-view" hidden data-module="keyword-system">
  <section class="keyword-library">
    <aside id="keyword-tree-panel" class="keyword-tree-panel">
      <div class="keyword-tree-heading"><div class="keyword-tree-title"><h3>分类目录</h3><span id="keyword-category-total">0</span></div><button id="keyword-add-root" type="button" title="新建顶层分类" aria-label="新建顶层分类">＋ 新建</button></div>
      <div class="keyword-tree-search"><input id="keyword-category-search" type="search" placeholder="查找分类" aria-label="查找分类"></div>
      <button id="keyword-all" class="keyword-all" type="button" aria-current="true">▦ 全部关键词</button>
      <div id="keyword-tree" class="keyword-tree"></div>
    </aside>
    <div id="keyword-tree-resizer" class="keyword-tree-resizer" aria-label="调整分类栏宽度"></div>
    <main class="keyword-content">
      <header class="keyword-content-toolbar">
        <div class="keyword-content-heading"><p id="keyword-category-path">关键词库</p><div><strong id="keyword-category-name">请选择分类</strong><span id="keyword-count"></span></div></div>
        <div class="keyword-content-actions">
          <div class="keyword-transfer-actions">
            <button id="keyword-download-template" class="keyword-tool-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 15v5h16v-5"/></svg>下载模板</button>
            <label class="keyword-import keyword-tool-button"><input id="keyword-import-file" type="file" accept=".xlsx"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><span>导入 Excel</span></label>
            <button id="keyword-export-xlsx" class="keyword-tool-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 15v5h16v-5"/></svg>导出 Excel</button>
          </div>
          <button id="keyword-add" class="keyword-tool-button" type="button" disabled>＋ 新增</button>
          <button id="keyword-clear-library" class="keyword-tool-button" type="button" disabled>清空数据</button>
        </div>
      </header>
      <div class="keyword-filterbar">
        <label class="keyword-search-field"><span aria-hidden="true">⌕</span><input id="keyword-search" type="search" placeholder="搜索关键词或中文翻译" aria-label="搜索关键词或中文翻译"></label>
      </div>
      <div id="keyword-selection-bar" class="keyword-selection-bar" hidden><strong id="keyword-selection-count"></strong><button id="keyword-copy-selected" type="button">复制</button><button id="keyword-move-selected" type="button">修改分类</button><button id="keyword-delete-selected" type="button">删除</button></div>
      <div class="keyword-table-wrap"><table class="keyword-table"><thead><tr><th class="keyword-check-cell"><input type="checkbox" id="keyword-select-all" aria-label="选择当前结果全部关键词"></th><th>关键词</th><th>中文翻译</th><th>操作</th></tr></thead><tbody id="keyword-list"><tr><td colspan="4">请选择左侧分类。</td></tr></tbody></table></div>
      <footer class="keyword-table-footer"><span id="keyword-visible-count"></span></footer>
    </main>
  </section>

  <p id="keyword-status" class="keyword-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>

  <dialog id="keyword-dialog" class="keyword-dialog" aria-labelledby="keyword-dialog-title" aria-describedby="keyword-dialog-description">
    <section class="keyword-dialog-card"><h3 id="keyword-dialog-title"></h3><p id="keyword-dialog-description"></p><input id="keyword-dialog-input" aria-label="确认内容" hidden><select id="keyword-dialog-select" aria-label="选择导入方式" hidden></select><p id="keyword-dialog-note" class="keyword-dialog-note" hidden></p><div class="keyword-dialog-actions"><button id="keyword-dialog-cancel" type="button">取消</button><button id="keyword-dialog-confirm" type="button">确认</button></div></section>
  </dialog>

  <dialog id="keyword-editor" class="keyword-editor" aria-labelledby="keyword-editor-title" aria-describedby="keyword-editor-description">
    <form id="keyword-editor-form">
      <header class="keyword-editor-header"><div><small id="keyword-editor-eyebrow">编辑分类</small><h3 id="keyword-editor-title"></h3><p id="keyword-editor-description"></p></div><button type="button" data-close-editor aria-label="关闭编辑弹窗">×</button></header>
      <div id="keyword-editor-fields" class="keyword-editor-fields"></div>
      <p id="keyword-editor-error" class="keyword-editor-error" role="alert" hidden></p>
      <footer class="keyword-editor-footer"><span id="keyword-editor-hint">Ctrl / ⌘ + S 保存</span><label class="keyword-continue-label" id="keyword-editor-continue-label" hidden><input type="checkbox" id="keyword-editor-continue">保存后继续新增</label><div><button type="button" data-close-editor>取消</button><button id="keyword-editor-save" type="submit">保存修改</button></div></footer>
    </form>
  </dialog>
</section>
